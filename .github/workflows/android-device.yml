name: Android device tests

# Instrumented tests on an Android emulator with real network access:
# catalog download/parse on the Android runtime and an end-to-end UI smoke
# test with screenshots (published to the "device-test" pre-release).
on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --stacktrace

      - name: Run on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci/device_tests.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          files=$(ls device-evidence/smoke/*.png 2>/dev/null || true)
          [ -z "$files" ] && { echo "no screenshots"; exit 0; }
          gh release delete device-test --yes --cleanup-tag || true
          gh release create device-test $files device-evidence/logcat.txt --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Device test evidence ${GITHUB_SHA::7}" \
            --notes "Screenshots and logcat from the emulator smoke test (run ${GITHUB_RUN_ID})."
