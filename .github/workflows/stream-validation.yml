name: Stream validation

# Finds broadcaster-hosted streams in iptv-org, applies the owner's
# publication policy, probes them (Tier A) and plays each one on an Android
# emulator with the app's own Media3 configuration (Tier B). Only streams that
# pass every Tier B criterion are written to verified-streams.json, which the
# Catalog workflow publishes to the app.
#
# Evidence (policy report, Tier A, Tier B per-stream measurements) is
# published to the "stream-validation" pre-release.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel emulator jobs"
        default: "16"
      per_shard:
        description: "Streams per emulator job"
        default: "30"
  schedule:
    - cron: "41 2 * * 1"   # weekly re-validation (Monday 02:41 UTC)

permissions:
  contents: read

concurrency:
  group: stream-validation
  cancel-in-progress: false

jobs:
  plan:
    name: Discover, policy, Tier A
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch iptv-org data
        run: |
          set -euo pipefail
          mkdir -p data-iptv
          curl -fsSL -o data-iptv/iptv_gh-pages_index.m3u https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/index.m3u
          for f in channels feeds blocklist languages categories; do
            curl -fsSL -o "data-iptv/database_master_data_${f}.csv" "https://raw.githubusercontent.com/iptv-org/database/master/data/${f}.csv"
          done
          ls -la data-iptv
      - name: Discovery
        run: |
          set -euo pipefail
          pip install --quiet tldextract
          python3 scripts/stream-discovery/discover_iptv_org.py --data data-iptv --out work
      - name: Publication policy
        run: >
          python3 scripts/stream-validation/plan_validation.py filter
          --candidates work/review_candidates.csv --policy scripts/stream-validation/publication_policy.json
          --out work/approved.csv --report work/policy-report.json
      - name: Tier A probe
        run: python3 scripts/stream-validation/probe_streams.py --candidates work/approved.csv --out work/tier-a.json --workers 32
      - name: Plan Tier B shards
        id: shard
        run: |
          set -euo pipefail
          python3 scripts/stream-validation/plan_validation.py shard --approved work/approved.csv \
            --policy scripts/stream-validation/publication_policy.json --tier-a work/tier-a.json \
            --shards "${{ inputs.shards || '16' }}" --per-shard "${{ inputs.per_shard || '30' }}" --out-dir work/shards
          echo "matrix=$(cat work/shards/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: work/
          retention-days: 14

  build:
    name: Build validator APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:player:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: validator-apk
          path: core/player/build/outputs/apk/androidTest/debug/player-debug-androidTest.apk
          retention-days: 7

  tier-b:
    name: Tier B playback (shard ${{ matrix.shard }})
    needs: [plan, build]
    if: ${{ needs.plan.outputs.matrix != '' && !contains(needs.plan.outputs.matrix, '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@v8
        with:
          name: validator-apk
          path: core/player/build/outputs/apk/androidTest/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play streams on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash scripts/ci/run_tier_b.sh work/shards/streams-${{ matrix.shard }}.json results/results-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tier-b-${{ matrix.shard }}
          path: results/
          retention-days: 14

  aggregate:
    name: Aggregate and publish evidence
    needs: [plan, tier-b]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@v8
        with:
          pattern: tier-b-*
          path: results
          merge-multiple: true
      - name: Aggregate Tier B results
        run: |
          set -euo pipefail
          mkdir -p results
          python3 scripts/stream-validation/aggregate_results.py --results results --approved work/approved.csv \
            --planned work/shards --out verified-streams.json --report validation-report.json
      - name: Publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp work/policy-report.json work/tier-a.json work/discovery_summary.json .
          if ! gh release view stream-validation >/dev/null 2>&1; then
            gh release create stream-validation --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "TVKu stream validation" \
              --notes "Evidence from the Stream validation workflow: policy decisions, Tier A probe, Tier B emulator playback measurements and the verified stream list used by the catalog."
          fi
          gh release upload stream-validation verified-streams.json validation-report.json policy-report.json tier-a.json discovery_summary.json --clobber
      - name: Rebuild catalog with verified streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
