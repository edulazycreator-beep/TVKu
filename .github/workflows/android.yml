name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates gradle-wrapper.jar against known Gradle checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Summarise tests and lint
        if: always()
        run: python3 scripts/ci/summarize_reports.py .

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tvku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  # Publishes the tested debug APK as a pre-release so it can be downloaded
  # straight to a phone. Only after the build job (tests + lint) succeeded on main.
  publish-dev-build:
    name: Publish dev build
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tvku-debug-apk
          path: apk

      - name: Replace the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          SRC="$(ls apk/*.apk | head -n1)"
          APK="apk/TVKu-dev-${SHORT}.apk"
          mv "$SRC" "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest "$APK" "$APK.sha256" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "TVKu dev build ${SHORT}" \
            --notes "Development build from commit ${GITHUB_SHA}. Debug-signed, for testing only. Built and unit-tested by the Android workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The channel catalog is not connected yet (needs the Supabase project), so the home screen shows no channels."
