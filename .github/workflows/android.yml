name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates gradle-wrapper.jar against known Gradle checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Summarise tests and lint
        if: always()
        run: python3 scripts/ci/summarize_reports.py .

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tvku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
