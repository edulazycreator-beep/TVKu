name: Catalog

# Builds the interim public channel catalog from approved curated sources and
# publishes it as the release asset the app downloads:
#   https://github.com/<owner>/<repo>/releases/download/catalog/catalog-v1.json
on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/catalog.yml"]
  pull_request:
    paths: ["scripts/**", ".github/workflows/catalog.yml"]
  schedule:
    - cron: "17 */6 * * *"   # re-check official links every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-tests:
    name: Script unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: |
          set -euo pipefail
          for d in scripts/playlist-parser scripts/stream-validation scripts/catalog; do
            (cd "$d" && python3 -m unittest -v 2>&1 | tail -n 3; exit "${PIPESTATUS[0]}")
          done

  publish:
    name: Build and publish catalog
    needs: scripts-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch verified streams (Stream validation workflow)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download stream-validation --pattern verified-streams.json --clobber \
            || echo "::warning title=Catalog::no verified-streams.json yet; publishing without streams"
      - name: Build catalog (with official link checks)
        run: >
          python3 scripts/catalog/build_catalog.py --curated scripts/database-import/curated_sources.json
          --verified-streams verified-streams.json --out catalog-v1.json --check-links
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('catalog-v1.json')); assert d['schema']==1 and d['channels']"
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "TVKu channel catalog" \
              --notes "Machine-readable channel catalog used by the TVKu app until the Supabase backend is online. Regenerated by the Catalog workflow."
          fi
          gh release upload catalog catalog-v1.json --clobber

      # Mirrors: some networks block one host but not another. The app tries
      # the release asset, then raw.githubusercontent.com, then jsDelivr.
      - name: Publish mirror branch (catalog-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp catalog-v1.json "$tmp/"
          cd "$tmp"
          git init -q -b catalog-data
          git config user.name "tvku-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-v1.json
          git commit -qm "Catalog $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog-data
          # Ask jsDelivr to drop its cached copy (best effort).
          curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@catalog-data/catalog-v1.json" >/dev/null || echo "jsDelivr purge skipped"
